[project]
name = "scientific-spaces-index"
version = "0.1.0"
description = "Metadata-only indexer and topic classifier for spaces.ac.cn articles."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
