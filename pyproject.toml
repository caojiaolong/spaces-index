[project]
name = "scientific-spaces-index"
version = "0.1.0"
description = "Noncommercial scientific article library with topic and series indexes, faithful Markdown and incremental updates."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "markdown-it-py>=3,<4",
    "pyyaml>=6,<7",
    "requests>=2.32,<3",
    "tinycss2>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
