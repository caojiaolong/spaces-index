<p>今天和校长忙了一整天，还把妈妈都叫来了，什么交流、讨论、说明...终于把所有学校里的手续都办好了，明天就出发到石门中学，后天就直奔期待已久的固原。</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/651/" title="固原一中.jpg"><img alt="固原一中" src="/usr/uploads/2010/05/2522278599.jpg" style="max-width: 100%"/></a></div><p class="typecho-caption-text">固原一中</p></div></div><p>那又是许许多多的第一次：第一次参加国赛，第一次坐飞机，第一次出省，第一次和这么多的“陌生人”闹着、努力着，第一次参与到众多同好的活动中，第一次....总之，许许多多，无论结果如何，这都注定了珠江会是一次十分十分十分难忘的外出！</p><p>忙完这一次比赛后，我就会继续投入到我的学习中：天文、数学、物理，对了，最近还增加了一个“篮球”，我要成为篮球高手！！！</p>
