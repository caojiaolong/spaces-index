<p>这将是我第一次整夜守候流星雨，如果能够成功观测，这将是我第一次观测到流星雨——狮子座流星雨。</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="/attachment/282/" title="狮子座流星雨11月18日光临地球.jpg"><img alt="狮子座流星雨11月18日光临地球" src="/usr/uploads/2009/11/2322463683.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text">狮子座流星雨11月18日光临地球</p></div></div><p>据预测，这一次的爆发将会在18日凌晨5点后，ZHR至少有100。</p><p>本来连续两天的阴雨天气已经使我觉得希望渺茫，但是今天下午居然破天荒出现了太阳。而且在今晚出现了难得的晴空——漫天的繁星，令我好不兴奋！于是决定守夜等雨！</p><p>通过“晴天钟”查看了今明的天气，应该还不错的。<br/>
<img height="300" src="https://7timer.y234.cn/exe/apanel.php?lon=112.2&amp;lat=22.68&amp;zh_cn" width="600"/></p><p>默默期待中...（待续）</p>
