<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/1726/" title="中秋2012.png"><img alt="中秋2012" src="/usr/uploads/2012/09/3938061350.png" style="max-width: 100%"/></a></div><p class="typecho-caption-text">中秋2012</p></div></div><blockquote><p>明月几时有，把酒问青天，不知相聚时刻，它夕是何年？我欲乘风归去，又带月饼佳酿，唯恐不尽兴。起舞弄月影，胜似在天宫！</p><p>转楼台，低月映，照无眠。不应有愁，何事月在秋心圆。人有萍聚萍散，月有半圆半缺，此事古难求。但愿人长久，千里共婵娟。</p><p>——BoJone修改版《水调歌头》</p></blockquote><p>我的好朋友，祝你中秋快乐，快乐一生，事业爱情如意！让科学空间与你我情谊地久天长！^_^</p>
