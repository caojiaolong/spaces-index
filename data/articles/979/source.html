<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="/attachment/980/" title="2010年诺贝尔化学奖.jpg"><img alt="2010年诺贝尔化学奖" src="/usr/uploads/2010/10/1113805323.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text">2010年诺贝尔化学奖</p></div></div><p>瑞典皇家科学院6日宣布，因其在有机合成领域中钯催化交叉偶联反应方面进行的卓越研究，将2010年诺贝尔化学奖授予来自美国特拉华大学的海克（Richard F. Heck）、普渡大学的根岸英一（Ei-ichi Negishi），以及日本北海道大学的铃木章（Akira Suzuki）。</p><p>诺贝尔委员会称，这三名科学家因在有机合成领域中钯催化交叉偶联反应方面进行的卓越研究而获奖。这一成果广泛应用于制药、电子工业和先进材料等领域，可以使人类造出复杂的有机分子。</p><p>理查德·赫克目前在美国特拉华大学工作，根岸荣一目前在美国普渡大学工作，而铃木章是北海道大学名誉教授。</p>
