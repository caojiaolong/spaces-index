<p>本站使用typecho作为blog程序，这个程序本身的防评论灌水机制不强，需要安装一些插件才可以有效防止机器人灌水。<br/>
为了方便与读者的交流，我决定不再采用各种验证码插件，而直接使用评论过滤。规则如下：</p><blockquote>1、全英文的评论内容将导致评论失败！<br/>
2、有禁止词语的评论将会失败！<br/>
3、带有<font color="red">http</font>的评论内容将会进入“审核”而暂时不能显示，等我审核通过了就可以显示了。</blockquote><p>第三种情况对于一般读者来说比较常见，所以如果遇到提交评论后却没有显示，请不要重复提交！因为评论失败会有明确显示的。</p><p>谢谢！</p>
