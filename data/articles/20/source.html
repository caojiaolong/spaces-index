<p><span style="color:Blue">NASA很早就开始实行不间断直播了，内容包括飞船的发射、最新消息公布等等。而国际空间站直播则是今年3月的事情。据国外媒体报道，美国宇航局已开始在线直播有关国际空间站外景象的视频，但欣赏这种直播是有条件的，网民必须等到空间站工作人员睡觉或者下班的时候。</span></p><p><span style="color:Green">而在今年，我们将会首次利用这种技术直播日全食，对于我们来说，这将是一次伟大的尝试。届时，“科学空间”将会及时地为大家提供日全食直播欣赏。现在，让我们来看下NASA的杰作！</span></p><p>观看地址：<a href="https://www.nasa.gov/multimedia/nasatv/index.html" target="_blank">https://www.nasa.gov/multimedia/nasatv/index.html</a></p>
