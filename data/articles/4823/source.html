<p></p><div class="pic-container" style="float:right; margin: 5px auto 2px 1px"><div style="display: inline-block; background-color: #fff"><div class="typecho-caption aligncenter" style="max-width: 225px; margin: 0 0 0 8px"><div style="margin: 5px"><a href="/usr/uploads/2018/01/3927975361.png" target="_blank" title="点击查看原图"><img alt="花式自然语言处理" src="/usr/uploads/2018/01/3927975361.png" style="max-width: 100%"/></a></div><p>花式自然语言处理</p></div></div></div><p>这是前两天在华南师范大学进行交流的时候所用的slide，主要介绍了自然语言处理的一些技巧。</p><p>这个slide的出发点是：国内高校很多搞NLP的小组基本都停留在RNN的思维中，所以我介绍了CNN、Attention的一些内容，并且介绍了模型训练的一些技巧，等等。内容其实比较简短，但考虑到不少概念对于多数同学来说都是新的，因此信息量还是蛮大的。</p><p>这也是我第一次尝试用$\LaTeX$来做slide，感觉也没有想象中那么难，做出来的效果还是挺清新明了的，以后要多练习～</p><p>下载链接：<a href="/usr/uploads/2018/01/2257698255.pdf">花式自然语言处理.pdf</a></p>
