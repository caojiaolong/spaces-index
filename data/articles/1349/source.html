<p>由于学校有一点事情要处理，不能抽出时间去更新天象预报。加上由于意外，导致4月份的《天文爱好者》在前几天才到，天象资讯不及时，就来不及更新了。因此，本月暂停天象预报，在此公告一下。感到非常抱歉。</p><p>文章还是尽量抽时间更新的，做一下预报，下两篇文章是关于天体力学两个很著名的问题：“双引力中心”问题和“固定引力中心+恒力”问题。即讨论在两个固定的质点的引力吸引下第三个质点的运动轨迹，以及在一个固定质点的引力和一个恒力共同作用下（在二体问题的基础上加上一个恒力）的天体的运动轨迹。这两个问题都是精确可积的，但网上和书上的资料都不是很多。</p>
