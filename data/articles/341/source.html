<p>今天只是在中午看到了几秒钟的太阳，天空一直都阴阴的。</p><p>这是中国本世纪首场日环食。此次日环食是近22年以来首次在中国发生的日环食，也是全球未来1000年内发生的日环食中环食持续时间最长的。广东虽然只能够看到偏食，但是也算是能够一饱眼福！</p><p>可惜，天公不作美，尽管怀着最大的希望去期待，仍然只是得到了失望。然而失望片刻，希望便再次而生。我期待着下一场食——今年的月食、2012的日环食（广东是日环食）</p><p><font color="blue">论坛讨论：</font><a href="http://bbs.spaces.ac.cn/topic.php?id=10" target="_blank">http://bbs.spaces.ac.cn/topic.php?id=10</a></p>
