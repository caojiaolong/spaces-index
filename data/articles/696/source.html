<p>今天一整天都是在交通工具上度过的......经过近10个小时的长度跋涉，终于到家了...</p><p>话说今天还创造了一个记录：一天之内，在三个省份着陆了（河北—北京—广东）</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/698/" title="2010.集训合照.jpg"><img alt="2010.集训合照" src="/usr/uploads/2010/07/3029088482.jpg" style="max-width: 100%"/></a></div><p class="typecho-caption-text">2010.集训合照</p></div></div><p>集训结束了，可以说获益匪浅，不仅仅学习到了很多理论，还收获了很多经验、朋友。而且，很幸运地能够代表中国在9月份参加2010年的IOAA（国际天文和天体物理学竞赛，据说这是国际三大天文奥赛最难的一个，今年在北京举行）。</p><p>集训过后，继续我的科学生活。</p><p><a href="/usr/uploads/2010/07/488733945.zip" title="集训合照.zip">集训合照.zip</a></p>
