<p>在此之前，<a href="http://album.spaces.ac.cn/" target="_blank">BoJone的相册</a>用的是phpyou相册程序，本来是喜欢它的简洁方便的，所以它这么多年不更新也没有介意。后来才发现，这个程序糟糕透了（不知道是不是我下载的版本不对）。昨天查了一下数据库，我发现我的数据库有16M大小，而一个phpyou就占用了12M，更离谱的是，它里边似乎镶嵌着许多不良敏感信息，所以，BoJone坚决抛弃它了。</p><p>现在使用的是<a href="http://www.minigal.de/" target="_blank">kh_mod</a>（<a href="http://code.google.com/p/dudumao1860/" target="_blank">中文网址</a>），而它也是基于之前的MG2架设的，也是属于简洁相册的类型。新相册基本保留了原来的目录结构和图片。当然，之前的相册已经很久没有更新了，以后会多与大家分享一些瞬间的^_^</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/1621/" title="新相册.PNG"><img alt="新相册" src="/usr/uploads/2012/06/2620281124.png" style="max-width: 100%"/></a></div><p class="typecho-caption-text">新相册</p></div></div>
