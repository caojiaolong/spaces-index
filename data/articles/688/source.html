<p></p><div class="pic-container" style="float:right; margin: 5px auto 2px 1px"><div style="display: inline-block; background-color: #fff"><div class="typecho-caption aligncenter" style="max-width: 250px; margin: 0 0 0 8px"><div style="margin: 5px"><a href="/attachment/660/" title="20100626月球模拟.png"><img alt="20100626月球模拟" src="/usr/uploads/2010/05/439660431.png" style="max-width: 100%"/></a></div><p>20100626月球模拟</p></div></div></div><p>今年天公貌似很喜欢捉弄天文爱好者...</p><p>今年我们可见的有大约4次“食”的想象：日环食（我们这是偏食）、两次月全食、还有一次“月掩金星”，也是比较难得的天象。其中，发生在01月15日的日食因天气原因完全看不到太阳的影子；5月16日的“月掩金星”，我们却已经赶到了宁夏固原，而固原不在掩星地区的范围内！今天的月食，再次因为天气原因，丝毫不能看到月球的身影...今夜月偏食最大食分为0.542，也即月亮的脸被挡去了一半以上。</p><p>虽然天公不作美，但是天文的热情不会减，依然满怀期待地等着12月21日的月食....希望到时候能够让我等大饱眼福。</p>
