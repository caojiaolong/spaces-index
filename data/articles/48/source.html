<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="http://antwrp.gsfc.nasa.gov/apod/image/0908/sn1006c.jpg" target="_blank"><img alt="一颗耀眼的明星SN 1006" src="https://antwrp.gsfc.nasa.gov/apod/image/0908/sn1006c_c800.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text">一颗耀眼的明星SN 1006</p></div></div><p><strong>说明：</strong></p><p><strong><span style="color:Red">一颗耀眼的明星SN 1006。</span></strong></p><p><font color="red">这可能是人类开始记录的历史中最亮的超新星爆发，公元1006年它的光芒照亮了整个地球的天空。它发现于南方的豺狼星座，恒星爆炸后的碎片云在不断扩大，在电磁频谱依然能够显示出来。这颗新星距离地球大约7000光年，也就是说大约8000年前发生爆炸，在1006年爆炸的光达到地球。</font></p><p><font color="red">这幅合成图片包含了钱德拉天文台的蓝X射线数据、 yellowish hues的光学数据以及红无线电图像数据。</font></p><p>NASA网址：<a href="http://antwrp.gsfc.nasa.gov/apod/astropix.html" target="_blank">http://antwrp.gsfc.nasa.gov/apod/astropix.html</a></p>
