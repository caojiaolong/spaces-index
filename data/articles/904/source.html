<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="/attachment/905/" title="各反射镜在月球上的位置.jpg"><img alt="各反射镜在月球上的位置" src="/usr/uploads/2010/08/2406352372.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text">各反射镜在月球上的位置</p></div></div><p>很多读者都听说过，现在地球上可以发射激光到月球，反射回来，通过计算一来一回的时间来测量地月距离。现在问题是，怎样的镜子才能够把来自不同角度的光都以相同的方向反射回去呢？实现这一目的的镜子称为“多角度反射镜”。</p><p>不要以为这会用到多难的物理知识，只要两面（考虑空间是三面）两两互相垂直的镜子便可以实现，请看下图（蓝色是镜子，橙色是光线）。</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/903/" title="多角度反射镜.PNG"><img alt="多角度反射镜" src="/usr/uploads/2010/08/3368771511.png" style="max-width: 100%"/></a></div><p class="typecho-caption-text">多角度反射镜</p></div></div><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="/attachment/902/" title="多角度反射镜2.PNG"><img alt="多角度反射镜2" src="/usr/uploads/2010/08/2796030397.png" style="max-width: 100%"/></a></div><p class="typecho-caption-text">多角度反射镜2</p></div></div>
