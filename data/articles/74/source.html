<p><font color="red">      前两天电脑被我随便设置弄“坏”了，昨天折腾了一整天，没有办法，今天送到专卖店修理，不到三分钟，OK！.....</font></p><p><strong>病症：</strong></p><blockquote>电脑能够启动，但是启动前那一声尖锐的“嘟”不见了，鼠标、键盘都不亮，显示器无信号。总而言之，就是主机仿佛停止了与外界的一切联系。</blockquote><p><br/>
<span style="color:Blue">其实送店修理前我已经知道了原因，就是因为我设置了BIOS而导致主机停止了信息输出，刷一下BIOS就应该会好的。但是我只会软刷，电脑不能输入/输出信息，我没有办法进行刷BIOS。</span></p><p><strong>真后悔刚才没有去看着师傅修理，不然就可以学到一点技巧了。</strong></p><p><span style="color:Red">现在一切都正常了，Blog也应该恢复正常更新了。欢迎大家继续支持，谢谢！</span></p>
