<p>八月一号开始我们这里的高三就正式开学了，以后每周都只能在星期天中午到下午的一小段时间里跟读者们见见面了^_^</p><p>高三的生活的确很枯燥、烦闷，特别是老师那句重复了无数遍的话“这个知识点在高考是这样出题的...”让我感觉十分讨厌，难道，学习就为了高考？就算真的是难以改变的现状，我也偏不服从。高考是要准备的，“活”也是要“生”的，为了生活而生存，而不是为了生存而生活。</p><p>虽然很忙，但我还是会抽一些时间出来研究自己感兴趣的东西的，如研究一下几何、不等式、多项式、对称等等，还有发一下呆^_^，当然也尽可能抽一些时间来这里写写我的学习心得吧——当然，频率应该会很低。</p><p>我相信，一年之后我不会后悔的。</p>
