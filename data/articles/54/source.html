<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="http://antwrp.gsfc.nasa.gov/apod/image/0908/triplesunrise_diacon_big.jpg" target="_blank"><img alt="" src="https://antwrp.gsfc.nasa.gov/apod/image/0908/triplesunrise_diacon.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text"></p></div></div><p><strong>说明：</strong></p><p><font color="red"><strong>出现在格但斯克湾的有着三个“太阳”的日出奇景！</strong></font></p><p><font color="red">什么时候会同时出现3个“太阳”？上个月，也就是2009年7月10日(星期五)， 上午04时半左右，波兰的格但斯克州中的格但斯克湾上演了这一美丽壮观的三日出奇景！实际上，每天只会升起一个太阳，但一些光学现象可以让我们看到两个甚至更多的“太阳”——这是海市蜃楼。</font></p><p><font color="red">但实际的观测效果怎样呢？海市蜃楼的拍摄效果取决于摄影师的技术和摄影机的质量。尽管如此，上述形象仍然是耐人寻味，因为摄影师拍出来的效果使得肉眼观看十分明显 。</font></p><p>NASA网址：<a href="http://antwrp.gsfc.nasa.gov/apod/astropix.html" target="_blank">http://antwrp.gsfc.nasa.gov/apod/astropix.html</a></p>
