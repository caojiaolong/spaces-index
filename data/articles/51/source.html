<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="http://antwrp.gsfc.nasa.gov/apod/image/0908/ngc6559_block_big.jpg" target="_blank"><img alt="" src="https://antwrp.gsfc.nasa.gov/apod/image/0908/ngc6559_block.jpg" style="max-width:100%"/></a></div><p class="typecho-caption-text"></p></div></div><p><strong>说明：</strong></p><p><font color="red"><strong>图片显示的是在NGC 6559中恒星,尘埃和星云。</strong></font></p><p><font color="red">在NGC 6559的星云中心布满了明亮的恒星与黑暗的星际气体，弥漫着红色辉光的部分主要是大量的氢，因为从邻近星球发出的高能光线游离了星际间的氢后，质子会再与电子结合而发出颜色特殊的光线，其中包括了这里所见的红色光泽。细小的尘埃颗粒则能极有效率地反射蓝色星光，形成两颗亮星附近的蓝色反射星云。同时尘埃也吸收可见光，造成看到的黑云及细丝。NGC 6559位于射手座方向，距离我们5000光年</font></p><p>NASA网址：<a href="http://antwrp.gsfc.nasa.gov/apod/astropix.html" target="_blank">http://antwrp.gsfc.nasa.gov/apod/astropix.html</a></p>
