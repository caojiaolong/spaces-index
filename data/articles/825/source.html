<p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 500px"><div style="margin: 5px"><a href="http://album.spaces.ac.cn/attachment/photo/29/139.jpg"><img alt="又是一年农耕时" src="https://album.spaces.ac.cn/attachment/photo/29/139.jpg" style="max-width: 100%"/></a></div><p class="typecho-caption-text">又是一年农耕时</p></div></div><p>昨晚的一个雷暴雨天气，弄断了电缆，停电20小时....不过也应该是“物有所值”了，“高烧”退了，天气舒服多了。</p><p>这些照片是前两天和母亲在田里插秧的时候拍摄的。又到了一年的农耕时节，作为土生土长的农孩，此时总是有众多感触。今年有了相机，就把这个场景记录下来了。</p><p>农村的生活是辛苦了一些，但是快乐依旧，因为快乐源于内心，而不是物质。这些天天气晴朗，我每晚都能够清晰地观赏银河，甚至都习以为常了，而这种情况，是多少人梦寐以求的、又是多少人不辞原路希望亲眼目睹的风光呀！</p><p>更多图片请查看：<a href="http://album.spaces.ac.cn/?id=29_1" target="_blank">http://album.spaces.ac.cn/?id=29_1</a></p>
