<p>文章<a href="/archives/2320/" target="_blank">《三个相切圆的公切圆》</a>中，笔者讲到利用反演作三个相切圆的公切圆，那时要求三个圆要两两相切。后来思考了一下，发现不用这个条件，只要三个之中的一个圆与另外两个圆都相切即可。</p><p>甚至，可以更宽松，三个圆之中，两个圆相切，第三个圆不一定相切的情况下都可以存在满足条件的公切圆。至于第三个圆的充分必要条件，则可以从它的反演像中可以看出：第三个圆的反演像要跟两条平行线之间的区域有交集。</p><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="/usr/uploads/2014/01/3144948531.png" target="_blank" title="点击查看原图"><img alt="三个圆的公切圆1" src="/usr/uploads/2014/01/3144948531.png" style="max-width:100%"/></a></div><p class="typecho-caption-text">三个圆的公切圆1</p></div></div><p></p><div class="pic-container"><div class="typecho-caption aligncenter" style="max-width: 100%"><div style="margin: 5px"><a href="/usr/uploads/2014/01/213272772.png" target="_blank" title="点击查看原图"><img alt="三个圆的公切圆2" src="/usr/uploads/2014/01/213272772.png" style="max-width:100%"/></a></div><p class="typecho-caption-text">三个圆的公切圆2</p></div></div>
