name: Update and deploy spaces index

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * *"

concurrency:
  group: spaces-index-pages
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    outputs:
      should_deploy: ${{ steps.changes.outputs.should_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Restore source request state
        if: github.event_name != 'push'
        uses: actions/cache/restore@v5
        with:
          path: |
            .cache/mirror/robots*.json
            .cache/image-cache/hosts-*.json
          key: source-requests-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: source-requests-${{ runner.os }}-v1-

      - name: Update index
        id: update
        if: github.event_name != 'push'
        # Update data first; build only once below, when there are changes.
        continue-on-error: true
        run: uv run python scripts/update_all.py --audience public --sleep 3 --skip-build

      - name: Save source request state
        if: always() && github.event_name != 'push' && steps.update.outcome != 'skipped'
        uses: actions/cache/save@v5
        with:
          path: |
            .cache/mirror/robots*.json
            .cache/image-cache/hosts-*.json
          key: source-requests-${{ runner.os }}-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check for deployable changes
        id: changes
        run: uv run python scripts/check_site_changes.py

      - name: Run tests
        if: steps.changes.outputs.should_deploy == 'true'
        run: uv run pytest

      - name: Build site
        if: steps.changes.outputs.should_deploy == 'true'
        run: uv run python scripts/build_site.py --input data/posts_classified.json --output _site

      - name: Commit refreshed metadata
        if: github.event_name != 'push' && steps.changes.outputs.should_commit == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md docs config data/README.md data/posts_raw.json data/posts.json data/posts_classified.json data/overrides.yaml data/articles
          if ! git diff --cached --quiet; then
            git commit -m "Update spaces index"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.changes.outputs.should_deploy == 'true'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: steps.changes.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: prepare
    if: needs.prepare.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
